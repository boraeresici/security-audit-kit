# NVIDIA NIM backend variant of the eval — Tier-L candidate comparison (see
# promptfooconfig.yaml for the Claude baseline; same prompt, same corpus, same assert —
# only the provider differs, so results are directly comparable).
#
# Run:   EVAL_CONFIG=promptfooconfig.nim.yaml EVAL_OUT=output.nim.json bash run.sh
# Needs: NVIDIA_API_KEY (build.nvidia.com API catalog). Model id + OpenAI-compatible
#        endpoint per docs.api.nvidia.com (verified 2026-07). Keep the model pinned; bump deliberately.
description: "sec-triage REAL/FP judgment eval — NVIDIA NIM GLM-5.2 backend"

prompts:
  - file://triage_prompt.md

providers:
  - id: openai:chat:z-ai/glm-5.2
    config:
      apiBaseUrl: https://integrate.api.nvidia.com/v1
      apiKeyEnvar: NVIDIA_API_KEY

defaultTest:
  assert:
    - type: javascript
      value: file://grade.mjs   # shared by every backend config — keep scores comparable

# Both splits are loaded; run.sh selects one via --filter-metadata split=<dev|holdout>.
# Default runs score the dev split. cases.holdout.yaml must not be read while tuning the prompt.
tests:
  - file://cases.yaml
  - file://cases.holdout.yaml
