      def archive(request):
          target = request.form["dir"]                 # untrusted
          subprocess.run(f"tar czf /tmp/b.tgz {target}", shell=True, check=True)
  metadata: { label: REAL, vuln_class: command-injection, split: holdout, difficulty: easy, source: synthetic }

