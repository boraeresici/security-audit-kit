- description: "FP zip-slip twin — member paths validated against the destination root"
  vars:
    finding_tool: semgrep
    finding_location: app/unpack.py:24
    finding_severity: ERROR
    finding_message: "Archive extraction detected"
    expected: FP
    code: |
      import os, zipfile
      DEST = "/srv/uploads"
      def unpack(request):
          with zipfile.ZipFile(request.files["z"]) as z:
              for m in z.namelist():
                  target = os.path.realpath(os.path.join(DEST, m))
                  if not target.startswith(DEST + os.sep):
                      raise ValueError("path escape")   # ../ members rejected
                  z.extract(m, DEST)
  metadata: { label: FP, fp_class: sanitized, vuln_class: path-traversal, split: holdout, difficulty: hard, source: synthetic }

