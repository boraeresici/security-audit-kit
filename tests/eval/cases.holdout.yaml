# Labeled triage corpus — HELD-OUT SPLIT (dev-only harness; see README.md).
#
# ┌──────────────────────────────────────────────────────────────────────────────────────────┐
# │ DO NOT READ THIS FILE WHILE TUNING THE JUDGMENT PROMPT.                                   │
# │                                                                                          │
# │ These cases exist to produce an UNBIASED score. The moment a prompt is edited in response │
# │ to a failure here, this file becomes a second tuning split and the number it produces     │
# │ stops meaning anything. If a holdout case reveals a genuine prompt gap: fix the prompt    │
# │ against a NEW dev case that captures the same rule, then re-measure here.                 │
# │                                                                                          │
# │ Grow this file by ADDING cases. Never edit or delete a case because a model failed it —   │
# │ that is how a test set is quietly rewritten into a training set.                          │
# └──────────────────────────────────────────────────────────────────────────────────────────┘
#
# Same schema and the same twin-pair design as cases.yaml. Vuln-class domains deliberately overlap
# with the dev split: if every unseen DOMAIN lived only here, a low holdout score would conflate
# "unseen case" with "unseen domain" and overstate the generalization gap.
#
# Run:  EVAL_SPLIT=holdout bash tests/eval/run.sh

# ================= REAL — should be caught (verdict = REAL) =================

- description: "REAL sqli — ORM raw() with a concatenated request value"
  vars:
    finding_tool: semgrep
    finding_location: app/reports.py:23
    finding_severity: ERROR
    finding_message: "Raw SQL built by string concatenation"
    expected: REAL
    code: |
      def report(request):
          org = request.GET["org"]                     # untrusted
          # .raw() does not parameterize a concatenated string
          return list(Sale.objects.raw("SELECT * FROM sales WHERE org = '" + org + "'"))
  metadata: { label: REAL, vuln_class: sql-injection, split: holdout, difficulty: easy, source: synthetic }

- description: "REAL command-injection — subprocess with shell=True on a request value"
  vars:
    finding_tool: semgrep
    finding_location: app/backup.py:12
    finding_severity: ERROR
    finding_message: "subprocess call with shell=True"
    expected: REAL
    code: |
