# Recon eval (dev-only; see README.md, "Recon eval"). Does recon rank the planted F40/F41 flaw first
# among safe-but-suspicious code? cases.recon.yaml is generated by make_recon_cases.py.
#   EVAL_CONFIG=promptfooconfig.recon.yaml EVAL_SCORER=score_recon.mjs bash tests/eval/run.sh
#
# recon_prompt.md is today's recon text of sec-sast-deep and sec-ai-review: the BASELINE that the
# F40/F41 class lists are measured against before they ship.
description: "recon eval"

prompts:
  - file://recon_prompt.md

providers:
  - id: anthropic:messages:claude-opus-4-8   # same tier as the other evals

defaultTest:
  assert:
    - type: javascript
      value: file://grade_recon.mjs

tests:
  - file://cases.recon.yaml
