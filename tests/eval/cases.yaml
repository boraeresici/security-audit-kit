- description: "FP deserialization twin — pickle.loads on data this process wrote itself"
  vars:
    finding_tool: semgrep
    finding_location: app/cache.py:18
    finding_severity: ERROR
    finding_message: "Avoid pickle.loads on untrusted data"
    expected: FP
    code: |
      import pickle
      # values are written by _put() below and never leave this process's private cache dir
      def _get(key):
          with open(f"/var/cache/app/{key}.pkl", "rb") as fh:
              return pickle.loads(fh.read())
      def _put(key, obj):
          with open(f"/var/cache/app/{key}.pkl", "wb") as fh:
              fh.write(pickle.dumps(obj))
  metadata: { label: FP, fp_class: not-reachable, vuln_class: deserialization, split: dev, difficulty: hard, source: synthetic }

