# Labeled triage corpus — DEV SPLIT (dev-only harness; see README.md).
#
# Each case is a promptfoo test: vars feed the judgment prompt; `expected` is the ground-truth
# verdict (REAL|FP) the model should reach. metadata documents the class for humans + reporting.
# Code is embedded as a STRING (not real .py/.js files) so it never trips the kit's own self-audit;
# any "secret" is an obvious placeholder.
#
# THIS IS THE TUNING SPLIT. Prompt/methodology changes may be iterated against these cases. That
# makes every score here optimistically biased — it is a training score, not a measurement. The
# headline number comes from cases.holdout.yaml, which must never be read while tuning.
#
# Design: most REAL cases have an FP TWIN here or in the holdout — same vuln class, differing by a
# single decisive property (sanitizer present, allow-list, reachability, safe API variant). Twins
# are what give the corpus discriminating power; a corpus of obvious cases measures nothing.
# `difficulty: hard` marks cases where the surface heuristic (a scary-looking token, a reassuring
# function name) points the wrong way.
#
# Splits are enforced mechanically: run.sh passes `--filter-metadata split=dev` by default.

# ================= REAL — should be caught (verdict = REAL) =================

- description: "REAL sqli — f-string into cursor.execute, reachable from request param"
  vars:
    finding_tool: semgrep
    finding_location: app/views.py:42
    finding_severity: ERROR
    finding_message: "Detected string formatting in a SQL statement (python.sqlalchemy.security.sql-injection)"
    expected: REAL
    code: |
      def get_user(request):
          uid = request.GET["id"]          # untrusted
          q = f"SELECT * FROM users WHERE id = {uid}"
          return db.cursor().execute(q).fetchone()
  metadata: { label: REAL, vuln_class: sql-injection, split: dev, difficulty: easy, source: synthetic }

