- description: "FP jwt twin — signature verified and algorithm pinned"
  vars:
    finding_tool: semgrep
    finding_location: app/auth.py:74
    finding_severity: ERROR
    finding_message: "JWT decode call detected"
    expected: FP
    code: |
      import jwt
      def current_user(request):
          token = request.headers["Authorization"].split()[1]
          # signature checked, algorithm pinned — no alg=none / HS-vs-RS confusion
          claims = jwt.decode(token, PUBLIC_KEY, algorithms=["RS256"])
          return User.objects.get(id=claims["sub"])
  metadata: { label: FP, fp_class: safe-parameterized, vuln_class: broken-auth, split: dev, difficulty: easy, source: synthetic }

