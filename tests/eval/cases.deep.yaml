# Labeled deep-review corpus — DEV SPLIT (dev-only harness; see README.md, "Deep-review eval").
#
# Each case is one recon CANDIDATE plus the code on its call path; `expected` is the verdict the
# verify phase should reach. `max_severity`, when set, is the highest severity the evidence chain
# supports (F39): a REAL rated above it fails. metadata.card names the backlog card the case
# measures; metadata.twin pairs a REAL with the FP that differs from it by one decisive property.
#
# Written with F39-F41, so these are tuning cases: a prompt may be iterated against them, and
# their score is optimistic. Code is embedded as strings, never as real source files; every
# secret is an obvious placeholder.

# ================= F39 — severity within the demonstrated impact =================

- description: "F39 REAL — user-supplied regex is a denial of service, not code execution"
  vars:
    skill: sec-sast-deep
    expected: REAL
    max_severity: medium
    candidate: "search/views.py:14 — Class 4 injection: the `pattern` query parameter is compiled as a regular expression; recon notes possible remote code execution through the regex engine."
    code: |
      # search/views.py
      import re
      from django.http import JsonResponse

      def search_logs(request):                       # public, no auth
          pattern = request.GET.get("pattern", "")
          lines = LOG_CACHE.recent(5000)
          hits = [l for l in lines if re.search(pattern, l)]   # line 14
          return JsonResponse({"hits": hits[:100]})
  metadata: { split: dev, card: F39, class: overstated-impact, twin: none }

