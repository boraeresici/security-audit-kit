  metadata: { split: dev, card: F40, class: memory-poisoning, twin: memory-poisoning }

- description: "F40 FP — memory holds only the user's own explicit notes, scoped to them, passed as quoted data"
  vars:
    skill: sec-ai-review
    expected: FP
    candidate: "agent/memory.py:16 — persistent memory poisoning: stored memories are injected into later prompts."
    code: |
      # agent/commands.py
      def handle_remember(session, text):
          # only the "/remember <note>" command writes memory; tool results and model output never do
          UserMemory.objects.create(user_id=session.user_id, text=text[:500])

      # agent/memory.py
      def memory_block(session):
          notes = UserMemory.objects.filter(user_id=session.user_id).order_by("-id")[:20]
          quoted = "\n".join(json.dumps(n.text) for n in notes)
          return {"role": "user", "content": "<user_notes>\n" + quoted + "\n</user_notes>"}   # line 16

      # agent/run.py — sessions are per user; the note block is a user turn, never the system prompt;
      # tools available to the model: search_docs (read-only).
  metadata: { split: dev, card: F40, class: memory-poisoning, twin: memory-poisoning }

- description: "F40 REAL — retrieval over a shared index with no tenant filter"
  vars:
    skill: sec-ai-review
    expected: REAL
    candidate: "rag/retrieve.py:9 — cross-tenant context bleed: the vector query has no tenant filter."
    code: |
      # rag/ingest.py
      def ingest(doc, tenant_id):
          index.upsert(id=doc.id, vector=embed(doc.text), metadata={"tenant_id": tenant_id, "text": doc.text})

      # rag/retrieve.py
      def context_for(question, user):
          hits = index.query(vector=embed(question), top_k=5, include_metadata=True)   # line 9
          return "\n\n".join(h.metadata["text"] for h in hits.matches)

      # chat/views.py — every tenant's users call context_for(); one index holds all tenants' documents.
  metadata: { split: dev, card: F40, class: context-bleed, twin: context-bleed }

- description: "F40 FP — the same retrieval, filtered by the caller's tenant"
  vars:
    skill: sec-ai-review
    expected: FP
    candidate: "rag/retrieve.py:9 — cross-tenant context bleed: one vector index holds every tenant's documents."
    code: |
      # rag/ingest.py
      def ingest(doc, tenant_id):
          index.upsert(id=doc.id, vector=embed(doc.text), metadata={"tenant_id": tenant_id, "text": doc.text})

      # rag/retrieve.py
      def context_for(question, user):
