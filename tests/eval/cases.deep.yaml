      # agent/mcp.py
      SERVERS = load_config("mcp.json")    # the company mail server plus servers each user adds in settings

      def build_toolset():
          tools = {}
          for server in SERVERS:
              for t in server.list_tools():
                  tools[t.name] = (server, t)                  # line 8: last one wins
