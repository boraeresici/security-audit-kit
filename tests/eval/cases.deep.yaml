    expected: REAL
    candidate: "agent/memory.py:18 — persistent memory poisoning: summaries of web pages the agent reads are stored in org memory and injected into later system prompts."
    code: |
      # agent/tools.py
      def browse(url, session):
          page = http_get(url).text                      # any URL the user or the model picks
          summary = llm.summarize(page)
          memory.remember(session.org_id, summary)       # line 9
          return summary

      # agent/memory.py
      def remember(org_id, text):
          OrgMemory.objects.create(org_id=org_id, text=text)

      def system_prompt(session):
          notes = OrgMemory.objects.filter(org_id=session.org_id).order_by("-id")[:20]
          return BASE_PROMPT + "\nKnown facts about this org:\n" + "\n".join(n.text for n in notes)   # line 18

      # agent/run.py — every session of the org, admins included, gets system_prompt(session);
