- description: "F40 REAL — the action runs with arguments re-read after the user approved a different one"
  vars:
    skill: sec-ai-review
    expected: REAL
    candidate: "agent/approvals.py:15 — approval binding: the executed arguments are not the approved ones."
    code: |
      # agent/approvals.py
      def propose(session, tool, args):
          pid = new_id()
          PENDING[pid] = {"tool": tool, "session": session.id}
          show_to_user(f"Agent wants to run {tool} with {args}. Approve?")   # user sees these args
          return pid

      @app.post("/approve/{pid}")
      def approve(pid: str, body: dict, user=Depends(current_user)):
          p = PENDING.pop(pid)
          if p["session"] != user.session_id:
              raise HTTPException(403)
          return TOOLS[p["tool"]](**body["args"])                             # line 15: args from this request

      # TOOLS includes transfer_funds(to_account, amount).
  metadata: { split: dev, card: F40, class: approval-binding, twin: approval-binding }

