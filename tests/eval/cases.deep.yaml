# ================= F41 — sibling paths and feature abuse (sec-sast-deep) =================

- description: "F41 REAL — single update is tenant-scoped, the bulk route to the same change is not"
  vars:
    skill: sec-sast-deep
    expected: REAL
    candidate: "billing/views.py:19 — sibling path: bulk_update_invoices changes invoice status like update_invoice."
    code: |
      # billing/views.py
      @api_view(["PATCH"])
      @permission_classes([IsAuthenticated])
      def update_invoice(request, pk):
          inv = get_object_or_404(Invoice, pk=pk, org=request.user.org)
          inv.status = request.data["status"]
          inv.save()
          return Response(status=204)

      @api_view(["POST"])
      @permission_classes([IsAuthenticated])
      def bulk_update_invoices(request):
          ids = request.data["ids"]
          Invoice.objects.filter(pk__in=ids).update(status=request.data["status"])   # line 19
          return Response(status=204)
  metadata: { split: dev, card: F41, class: sibling-guard, twin: sibling-guard }

- description: "F41 FP — both routes go through the same scoped queryset"
  vars:
    skill: sec-sast-deep
    expected: FP
    candidate: "billing/views.py:19 — sibling path: bulk_update_invoices changes invoice status like update_invoice."
    code: |
      # billing/views.py
      def scoped_invoices(user):
          return Invoice.objects.filter(org=user.org)

      @api_view(["PATCH"])
      @permission_classes([IsAuthenticated])
      def update_invoice(request, pk):
          inv = get_object_or_404(scoped_invoices(request.user), pk=pk)
          inv.status = request.data["status"]
          inv.save()
          return Response(status=204)

      @api_view(["POST"])
      @permission_classes([IsAuthenticated])
      def bulk_update_invoices(request):
          scoped_invoices(request.user).filter(pk__in=request.data["ids"]).update(status=request.data["status"])   # line 19
          return Response(status=204)
  metadata: { split: dev, card: F41, class: sibling-guard, twin: sibling-guard }

