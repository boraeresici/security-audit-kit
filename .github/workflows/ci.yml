name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false
      - name: shellcheck (pinned image — no version drift; uses repo .shellcheckrc)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb \
            scan.sh install.sh bootstrap.sh hooks/pre-commit hooks/pre-push hooks/pre-tool-install.sh lib/integrity.sh tests/e2e.sh tests/trust-gate.sh scripts/release.sh scripts/dogfood.sh scripts/skill-sums.sh tests/eval/run.sh

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'
      - name: install pytest
        run: pip install pytest
      - name: pytest (lib/ unit tests)
        run: python -m pytest tests/unit/ -v --tb=short

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'
      - name: e2e (offline — no docker, no uvx; external-tool assertions skip gracefully)
        run: PATH=/usr/bin:/bin:/usr/sbin:/sbin bash tests/e2e.sh
      - name: trust-the-gate (a branch cannot run code through the kit or switch it off)
        run: PATH=/usr/bin:/bin:/usr/sbin:/sbin bash tests/trust-gate.sh

  # Platform coverage (F18). Separate jobs, not a matrix on `pytest`/`e2e`: a matrix renames those
  # checks, and branch protection requires them by name.
  pytest-versions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
        # 3.9 is the documented minimum because it is macOS's own /usr/bin/python3; setup-python
        # no longer ships it for current Ubuntu images, so Linux tests its oldest available instead.
        exclude:
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python }}
      - name: install pytest
        run: pip install pytest
      - name: pytest (lib/ unit tests)
        run: python -m pytest tests/unit/ --tb=short

  e2e-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false
      - name: e2e on macOS (bash 3.2, BSD tools, system python3; offline like the Linux job)
        run: PATH=/usr/bin:/bin:/usr/sbin:/sbin bash tests/e2e.sh
      - name: trust-the-gate (a branch cannot run code through the kit or switch it off)
        run: PATH=/usr/bin:/bin:/usr/sbin:/sbin bash tests/trust-gate.sh

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false
      - name: claude plugin validate --strict (plugin + marketplace; pinned CLI, no login needed)
        run: |
          npx -y @anthropic-ai/claude-code@2.1.316 plugin validate --strict .
          npx -y @anthropic-ai/claude-code@2.1.316 plugin validate --strict .claude-plugin/marketplace.json

  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false
      - name: CHECKSUMS manifest is current
        run: |
          bash scan.sh checksums
          git diff --exit-code -- CHECKSUMS \
            || { echo "::error::CHECKSUMS is stale — run 'bash scan.sh checksums' and commit it"; exit 1; }
